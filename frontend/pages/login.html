<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SIPENMA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="login-wrapper">

    <!-- Illustration -->
    <div class="login-illustration">
        <img src="../assets/images/students.png" alt="Students Illustration">
    </div>

    <!-- Card -->
    <div class="login-card">

        <div class="login-card-header">
            <div class="logo-circle">
                <i class="bi bi-mortarboard-fill"></i>
            </div>
            <h4>SIPENMA</h4>
            <p>Sistem Pengelolaan Nilai Mahasiswa</p>
        </div>

        <div class="login-card-body">
            <div id="alertBox"></div>

            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label">Email / Username</label>
                    <input type="text" class="form-control" id="username" placeholder="Masukkan email atau username" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="password" placeholder="Masukkan password" required
                               style="border-radius:10px 0 0 10px;">
                        <button type="button" class="btn-eye" id="togglePassword">
                            <i class="bi bi-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-login">Login</button>
            </form>

            <a href="#" class="forgot-link">Lupa Password?</a>
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/auth.js"></script>
</body>
</html>
