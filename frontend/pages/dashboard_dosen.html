<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Dosen - SIPENMA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <div class="sidebar-brand">SIPENMA</div>
    <ul class="nav flex-column">
        <li class="nav-item">
            <a class="nav-link active" href="dashboard_dosen.html">
                <span class="link-left"><img src="../assets/icons/dashboard_sidebar_icon.png" class="sidebar-icon" alt=""> Dashboard</span>
                <i class="bi bi-chevron-right"></i>
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="mahasiswa_dosen.html">
                <span class="link-left"><img src="../assets/icons/mahasiswa_sidebar_icon.png" class="sidebar-icon" alt=""> Mahasiswa</span>
                <i class="bi bi-chevron-right"></i>
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="matakuliah_dosen.html">
                <span class="link-left"><img src="../assets/icons/matakuliah_sidebar_icon.png" class="sidebar-icon" alt=""> Mata Kuliah</span>
                <i class="bi bi-chevron-right"></i>
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="nilai.html">
                <span class="link-left"><img src="../assets/icons/inputnilai_sidebar_icon.png" class="sidebar-icon" alt=""> Input Nilai</span>
                <i class="bi bi-chevron-right"></i>
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="rekap_nilai.html">
                <span class="link-left"><img src="../assets/icons/rekapnilai_sidebar_icon.png" class="sidebar-icon" alt=""> Rekap Nilai</span>
                <i class="bi bi-chevron-right"></i>
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="statistik.html">
                <span class="link-left"><img src="../assets/icons/rekapnilai_sidebar_icon.png" class="sidebar-icon" alt=""> Statistik</span>
                <i class="bi bi-chevron-right"></i>
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="profile_dosen.html">
                <span class="link-left"><img src="../assets/icons/profile_sidebar_icon.png" class="sidebar-icon" alt=""> Profile</span>
                <i class="bi bi-chevron-right"></i>
            </a>
        </li>
    </ul>
    <div class="sidebar-logout">
        <a class="nav-link" href="../pages/login.html" id="logoutBtn">
            <span class="link-left"><img src="../assets/icons/logout_sidebar_icon.png" class="sidebar-icon" alt=""> Logout</span>
            <i class="bi bi-chevron-right"></i>
        </a>
    </div>
</div>

<!-- TOPBAR -->
<div class="topbar">
    <div class="topbar-user">
        <img src="../assets/images/avatar.png" alt="Avatar" onerror="this.src='https://ui-avatars.com/api/?name=Dosen&background=5b8dee&color=fff'">
        <div>
            <div class="user-name" id="topbarName">Dosen</div>
            <div class="user-role">Dosen</div>
        </div>
    </div>
    <div class="topbar-actions">
        <button class="icon-btn">
            <i class="bi bi-envelope-fill"></i>
            <span class="badge-dot"></span>
        </button>
        <button class="icon-btn">
            <i class="bi bi-gear-fill"></i>
        </button>
    </div>
</div>

<!-- MAIN CONTENT -->
<div class="main-content">

    <!-- STAT CARDS -->
    <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
            <div class="stat-card stat-purple">
                <div class="stat-label">Total Mahasiswa</div>
                <div class="stat-value" id="totalMahasiswa">340</div>
                <i class="bi bi-people stat-icon"></i>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="stat-card stat-orange">
                <div class="stat-label">Total Mata Kuliah</div>
                <div class="stat-value" id="totalMatkul">85</div>
                <i class="bi bi-book stat-icon"></i>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="stat-card stat-green">
                <div class="stat-label">Kelas Aktif</div>
                <div class="stat-value" id="kelasAktif">25</div>
                <i class="bi bi-mortarboard stat-icon"></i>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="stat-card stat-blue">
                <div class="stat-label">Rata-rata IPK</div>
                <div class="stat-value" id="rataNilai">3.40</div>
                <i class="bi bi-clipboard-data stat-icon"></i>
            </div>
        </div>
    </div>

    <!-- CHARTS -->
    <div class="row g-3">
        <div class="col-md-5">
            <div class="card p-3">
                <h6 class="fw-bold mb-3">Status Kelulusan</h6>
                <canvas id="kelulusanChart" height="220"></canvas>
            </div>
        </div>
        <div class="col-md-7">
            <div class="card p-3">
                <h6 class="fw-bold mb-3">Rata-rata Nilai per Mata Kuliah</h6>
                <canvas id="matkulChart" height="220"></canvas>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/dashboard_dosen.js"></script>
</body>
</html>
