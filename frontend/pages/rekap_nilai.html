<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Nilai - SIPENMA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/table.css">
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <div class="sidebar-brand">SIPENMA</div>
    <ul class="nav flex-column">
        <li class="nav-item">
            <a class="nav-link" href="dashboard_dosen.html">
                <span class="link-left"><img src="../assets/icons/dashboard_sidebar_icon.png" class="sidebar-icon" alt=""> Dashboard</span>
                <i class="bi bi-chevron-right"></i>
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="mahasiswa_dosen.html">
                <span class="link-left"><img src="../assets/icons/mahasiswa_sidebar_icon.png" class="sidebar-icon" alt=""> Mahasiswa</span>
                <i class="bi bi-chevron-right"></i>
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="matakuliah_dosen.html">
                <span class="link-left"><img src="../assets/icons/matakuliah_sidebar_icon.png" class="sidebar-icon" alt=""> Mata Kuliah</span>
                <i class="bi bi-chevron-right"></i>
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="nilai.html">
                <span class="link-left"><img src="../assets/icons/inputnilai_sidebar_icon.png" class="sidebar-icon" alt=""> Input Nilai</span>
                <i class="bi bi-chevron-right"></i>
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link active" href="rekap_nilai.html">
                <span class="link-left"><img src="../assets/icons/rekapnilai_sidebar_icon.png" class="sidebar-icon" alt=""> Rekap Nilai</span>
                <i class="bi bi-chevron-right"></i>
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="statistik.html">
                <span class="link-left"><img src="../assets/icons/rekapnilai_sidebar_icon.png" class="sidebar-icon" alt=""> Statistik</span>
                <i class="bi bi-chevron-right"></i>
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="profile_dosen.html">
                <span class="link-left"><img src="../assets/icons/profile_sidebar_icon.png" class="sidebar-icon" alt=""> Profile</span>
                <i class="bi bi-chevron-right"></i>
            </a>
        </li>
    </ul>
    <div class="sidebar-logout">
        <a class="nav-link" href="../pages/login.html" id="logoutBtn">
            <span class="link-left"><img src="../assets/icons/logout_sidebar_icon.png" class="sidebar-icon" alt=""> Logout</span>
            <i class="bi bi-chevron-right"></i>
        </a>
    </div>
</div>

<!-- TOPBAR -->
<div class="topbar">
    <div class="topbar-user">
        <img src="../assets/images/avatar.png" alt="Avatar" onerror="this.src='https://ui-avatars.com/api/?name=Dosen&background=5b8dee&color=fff'">
        <div>
            <div class="user-name" id="topbarName">Dosen</div>
            <div class="user-role">Dosen</div>
        </div>
    </div>
    <div class="topbar-actions">
        <button class="icon-btn"><i class="bi bi-envelope-fill"></i><span class="badge-dot"></span></button>
        <button class="icon-btn"><i class="bi bi-gear-fill"></i></button>
    </div>
</div>

<!-- MAIN CONTENT -->
<div class="main-content">

    <!-- Toolbar -->
    <div class="d-flex gap-2 mb-3 align-items-center flex-wrap">
        <div class="input-group flex-grow-1" style="max-width:420px;">
            <span class="input-group-text bg-white border-end-0" style="border-radius:30px 0 0 30px; border:1.5px solid #b8d0f8;">
                <i class="bi bi-search text-muted"></i>
            </span>
            <input type="text" id="searchInput" class="form-control border-start-0"
                   placeholder="Cari mahasiswa (nama, NIM, jurusan)"
                   style="border-radius:0 30px 30px 0; border:1.5px solid #b8d0f8; border-left:none;">
        </div>
        <select class="filter-select" id="filterMatkul">
            <option value="">Semua Mata Kuliah</option>
        </select>
        <button class="btn btn-success rounded-pill px-3" id="exportBtn">
            <i class="bi bi-download me-1"></i>Export
        </button>
    </div>

    <!-- Table -->
    <div class="table-card mb-3">
        <table class="table mb-0">
            <thead>
                <tr>
                    <th>NIM</th>
                    <th>Nama</th>
                    <th>Mata Kuliah</th>
                    <th>Tugas</th>
                    <th>UTS</th>
                    <th>UAS</th>
                    <th>Nilai Akhir</th>
                    <th>Grade</th>
                </tr>
            </thead>
            <tbody id="rekapTable"></tbody>
        </table>
    </div>

    <!-- Summary Bar -->
    <div class="summary-bar">
        <div class="row text-center">
            <div class="col-3">
                <div class="sum-label">Total Data</div>
                <div class="sum-value" id="sumTotal">0</div>
            </div>
            <div class="col-3">
                <div class="sum-label">Rata-rata Nilai</div>
                <div class="sum-value sum-yellow" id="sumRata">0</div>
            </div>
            <div class="col-3">
                <div class="sum-label">Nilai Tertinggi</div>
                <div class="sum-value sum-green" id="sumMax">0</div>
            </div>
            <div class="col-3">
                <div class="sum-label">Nilai Terendah</div>
                <div class="sum-value sum-red" id="sumMin">0</div>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/rekap_nilai.js"></script>
</body>
</html>
