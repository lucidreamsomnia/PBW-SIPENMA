<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Nilai - SIPENMA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/form.css">
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <div class="sidebar-brand">SIPENMA</div>
    <ul class="nav flex-column">
        <li class="nav-item">
            <a class="nav-link" href="dashboard_dosen.html">
                <span class="link-left"><img src="../assets/icons/dashboard_sidebar_icon.png" class="sidebar-icon" alt=""> Dashboard</span>
                <i class="bi bi-chevron-right"></i>
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="mahasiswa_dosen.html">
                <span class="link-left"><img src="../assets/icons/mahasiswa_sidebar_icon.png" class="sidebar-icon" alt=""> Mahasiswa</span>
                <i class="bi bi-chevron-right"></i>
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="matakuliah_dosen.html">
                <span class="link-left"><img src="../assets/icons/matakuliah_sidebar_icon.png" class="sidebar-icon" alt=""> Mata Kuliah</span>
                <i class="bi bi-chevron-right"></i>
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link active" href="nilai.html">
                <span class="link-left"><img src="../assets/icons/inputnilai_sidebar_icon.png" class="sidebar-icon" alt=""> Input Nilai</span>
                <i class="bi bi-chevron-right"></i>
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="rekap_nilai.html">
                <span class="link-left"><img src="../assets/icons/rekapnilai_sidebar_icon.png" class="sidebar-icon" alt=""> Rekap Nilai</span>
                <i class="bi bi-chevron-right"></i>
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="statistik.html">
                <span class="link-left"><img src="../assets/icons/rekapnilai_sidebar_icon.png" class="sidebar-icon" alt=""> Statistik</span>
                <i class="bi bi-chevron-right"></i>
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="profile_dosen.html">
                <span class="link-left"><img src="../assets/icons/profile_sidebar_icon.png" class="sidebar-icon" alt=""> Profile</span>
                <i class="bi bi-chevron-right"></i>
            </a>
        </li>
    </ul>
    <div class="sidebar-logout">
        <a class="nav-link" href="../pages/login.html" id="logoutBtn">
            <span class="link-left"><img src="../assets/icons/logout_sidebar_icon.png" class="sidebar-icon" alt=""> Logout</span>
            <i class="bi bi-chevron-right"></i>
        </a>
    </div>
</div>

<!-- TOPBAR -->
<div class="topbar">
    <div class="topbar-user">
        <img src="../assets/images/avatar.png" alt="Avatar" onerror="this.src='https://ui-avatars.com/api/?name=Dosen&background=5b8dee&color=fff'">
        <div>
            <div class="user-name" id="topbarName">Dosen</div>
            <div class="user-role">Dosen</div>
        </div>
    </div>
    <div class="topbar-actions">
        <button class="icon-btn"><i class="bi bi-envelope-fill"></i><span class="badge-dot"></span></button>
        <button class="icon-btn"><i class="bi bi-gear-fill"></i></button>
    </div>
</div>

<!-- MAIN CONTENT -->
<div class="main-content">

    <div id="alertBox" class="mb-3"></div>

    <div class="form-card">

        <!-- Pilih Mahasiswa -->
        <div class="section-title">Pilih Mahasiswa</div>
        <div class="mb-3">
            <div class="input-group">
                <span class="input-group-text bg-white" style="border-radius:10px 0 0 10px; border:1.5px solid #d0d8e8;">
                    <i class="bi bi-search text-muted"></i>
                </span>
                <input type="text" id="searchMahasiswa" class="form-control" placeholder="Cari mahasiswa..."
                       style="border-radius:0 10px 10px 0; border:1.5px solid #d0d8e8; border-left:none;">
            </div>
            <select class="form-select mt-2" id="selectMahasiswa" size="1">
                <option value="">-- Pilih Mahasiswa --</option>
            </select>
        </div>

        <!-- Pilih Mata Kuliah -->
        <div class="section-title">Pilih Mata Kuliah</div>
        <div class="mb-4">
            <div class="input-group">
                <span class="input-group-text bg-white" style="border-radius:10px 0 0 10px; border:1.5px solid #d0d8e8;">
                    <i class="bi bi-search text-muted"></i>
                </span>
                <input type="text" id="searchMatkul" class="form-control" placeholder="Cari mata kuliah..."
                       style="border-radius:0 10px 10px 0; border:1.5px solid #d0d8e8; border-left:none;">
            </div>
            <select class="form-select mt-2" id="selectMatkul" size="1">
                <option value="">-- Pilih Mata Kuliah --</option>
            </select>
        </div>

        <!-- Komponen Nilai -->
        <div class="section-title">Komponen Nilai</div>
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <label class="form-label">Nilai Tugas (30%)</label>
                <input type="number" class="form-control" id="nilaiTugas" min="0" max="100" value="0">
            </div>
            <div class="col-md-4">
                <label class="form-label">Nilai UTS (30%)</label>
                <input type="number" class="form-control" id="nilaiUTS" min="0" max="100" value="0">
            </div>
            <div class="col-md-4">
                <label class="form-label">Nilai UAS (40%)</label>
                <input type="number" class="form-control" id="nilaiUAS" min="0" max="100" value="0">
            </div>
        </div>

        <button class="btn-save" id="simpanBtn">
            <i class="bi bi-floppy me-2"></i>Simpan Nilai
        </button>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/nilai.js"></script>
</body>
</html>
