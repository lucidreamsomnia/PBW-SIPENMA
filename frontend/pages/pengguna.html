<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengguna Admin - SIPENMA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/table.css">
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <div class="sidebar-brand">SIPENMA</div>
    <ul class="nav flex-column">
        <li class="nav-item">
            <a class="nav-link" href="dashboard_admin.html">
                <span class="link-left"><img src="../assets/icons/dashboard_sidebar_icon.png" class="sidebar-icon" alt=""> Dashboard</span>
                <i class="bi bi-chevron-right"></i>
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="mahasiswa_admin.html">
                <span class="link-left"><img src="../assets/icons/mahasiswa_sidebar_icon.png" class="sidebar-icon" alt=""> Mahasiswa</span>
                <i class="bi bi-chevron-right"></i>
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="matakuliah_admin.html">
                <span class="link-left"><img src="../assets/icons/matakuliah_sidebar_icon.png" class="sidebar-icon" alt=""> Mata Kuliah</span>
                <i class="bi bi-chevron-right"></i>
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link active" href="pengguna.html">
                <span class="link-left"><img src="../assets/icons/profile_sidebar_icon.png" class="sidebar-icon" alt=""> Pengguna</span>
                <i class="bi bi-chevron-right"></i>
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="profile_admin.html">
                <span class="link-left"><img src="../assets/icons/profile_sidebar_icon.png" class="sidebar-icon" alt=""> Profile</span>
                <i class="bi bi-chevron-right"></i>
            </a>
        </li>
    </ul>
    <div class="sidebar-logout">
        <a class="nav-link" href="../pages/login.html" id="logoutBtn">
            <span class="link-left"><img src="../assets/icons/logout_sidebar_icon.png" class="sidebar-icon" alt=""> Logout</span>
            <i class="bi bi-chevron-right"></i>
        </a>
    </div>
</div>

<!-- TOPBAR -->
<div class="topbar">
    <div class="topbar-user">
        <img src="../assets/images/avatar.png" alt="Avatar" onerror="this.src='https://ui-avatars.com/api/?name=Admin&background=5b8dee&color=fff'">
        <div>
            <div class="user-name" id="topbarName">Admin</div>
            <div class="user-role">Admin</div>
        </div>
    </div>
    <div class="topbar-actions">
        <button class="icon-btn"><i class="bi bi-envelope-fill"></i><span class="badge-dot"></span></button>
        <button class="icon-btn"><i class="bi bi-gear-fill"></i></button>
    </div>
</div>

<!-- MAIN CONTENT -->
<div class="main-content">

    <div id="alertBox" class="mb-3"></div>

    <!-- Search and Actions -->
    <div class="row g-2 mb-3 align-items-center">
        <div class="col-md-5">
            <div class="input-group">
                <span class="input-group-text bg-white border-end-0" style="border-radius:30px 0 0 30px; border:1.5px solid #b8d0f8;">
                    <i class="bi bi-search text-muted"></i>
                </span>
                <input type="text" id="searchInput" class="form-control border-start-0"
                       placeholder="Cari pengguna (username, email, role)"
                       style="border-radius:0 30px 30px 0; border:1.5px solid #b8d0f8; border-left:none;">
            </div>
        </div>
        <div class="col-md-3">
            <select class="form-select filter-select" id="filterRole">
                <option value="">Semua Role</option>
            </select>
        </div>
        <div class="col-md-3">
            <select class="form-select filter-select" id="filterStatus">
                <option value="">Semua Status</option>
            </select>
        </div>
        <div class="col-md-1 d-grid">
            <button class="btn btn-primary" id="addBtn" title="Tambah Pengguna">
                <i class="bi bi-plus-lg"></i>
            </button>
        </div>
    </div>

    <!-- Table -->
    <div class="table-card">
        <table class="table mb-0">
            <thead>
                <tr>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th>Created At</th>
                    <th class="text-end">Aksi</th>
                </tr>
            </thead>
            <tbody id="penggunaTable">
                <tr>
                    <td colspan="6" class="text-center text-muted py-3">Memuat data...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Pagination -->
    <nav class="mt-3 d-flex justify-content-end">
        <ul class="pagination" id="pagination"></ul>
    </nav>

</div>

<!-- Create/Edit Modal -->
<div class="modal fade" id="penggunaModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <form id="penggunaForm">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Tambah Pengguna</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="inputId">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Username</label>
                            <input type="text" class="form-control" id="inputUsername" required maxlength="50">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" id="inputEmail" required maxlength="100">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Role</label>
                            <select class="form-select" id="inputRole" required></select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Status</label>
                            <select class="form-select" id="inputStatus" required></select>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" id="inputPassword" minlength="6" maxlength="255">
                            <div class="form-text" id="passwordHelp">Password wajib diisi saat membuat pengguna baru.</div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Batal</button>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-floppy me-2"></i>Simpan
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Delete Modal -->
<div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Hapus Pengguna</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p class="mb-0">Yakin ingin menghapus <strong id="deleteName">pengguna ini</strong>?</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-light" data-bs-dismiss="modal">Batal</button>
                <button type="button" class="btn btn-danger" id="confirmDeleteBtn">
                    <i class="bi bi-trash me-2"></i>Hapus
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/pengguna.js"></script>
</body>
</html>
